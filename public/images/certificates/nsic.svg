<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" width="100%" height="100%" fill="none">
  <!-- NSIC Geometric Emblem -->
  <g transform="translate(100, 5)">
    <!-- Top Orange Triangle -->
    <polygon points="0,5 -18,22 18,22" fill="#FF7900"/>
    <!-- Middle Green Chevron Roof -->
    <polygon points="0,26 -28,45 -18,45 0,33 18,45 28,45" fill="#008751"/>
    <!-- Lower Base Bar -->
    <rect x="-18" y="47" width="36" height="3" fill="#1F2937"/>
  </g>
  
  <!-- Hindi & English NSIC Typography -->
  <text x="100" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1F2937" letter-spacing="1">एन एस आई सी</text>
  <text x="100" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#1F2937" letter-spacing="3.5">N S I C</text>
</svg>
