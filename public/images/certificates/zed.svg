<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" width="100%" height="100%" fill="none">
  <!-- Circular Bronze Medallion -->
  <g transform="translate(100, 45)">
    <!-- Medallion Outer Ring -->
    <circle cx="0" cy="-2" r="38" fill="#FDF8F0" stroke="#8C532B" stroke-width="3.5"/>
    <circle cx="0" cy="-2" r="33" fill="none" stroke="#CD7F32" stroke-width="1.5" stroke-dasharray="3 2"/>
    
    <!-- Curved Top Text: CERTIFIED COMPANY -->
    <path id="curve" d="M -26 -8 A 28 28 0 0 1 26 -8" fill="none"/>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="5" font-weight="800" fill="#8C532B" letter-spacing="1">
      <textPath href="#curve" startOffset="50%" text-anchor="middle">CERTIFIED COMPANY</textPath>
    </text>
    
    <!-- ZED Center Logo -->
    <g transform="translate(0, -4)">
      <!-- Z in Blue/Dark -->
      <text x="-12" y="8" font-family="'Segoe UI', Impact, Arial, sans-serif" font-size="20" font-weight="900" fill="#1E3A8A">Z</text>
      <!-- e in Green -->
      <text x="0" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#16A34A">e</text>
      <!-- d in Red -->
      <text x="9" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#DC2626">d</text>
    </g>
    
    <!-- Ribbon Base with BRONZE -->
    <path d="M -26 15 L 26 15 L 22 26 L -22 26 Z" fill="#8C532B"/>
    <text x="0" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BRONZE</text>
  </g>
</svg>
